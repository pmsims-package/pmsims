url: https://pmsims-package.github.io/pmsims/

development:
  mode: auto
  version_tooltip: "Documentation for the development version of pmsims"

template:
  bootstrap: 5
  bootswatch: cosmo
  math-rendering: mathjax
  bslib:
    primary: "#04adbf"
    # primary: "#0054AD"
    danger: "#A6081A"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

output_dir: docs

extra_files:
  - man/figures

navbar:
  structure:
    left: [get-started, reference, articles, news]
    right: [versions, search, github, lightswitch]
  components:
    versions:
      # CI replaces this with the label for each published site. Keeping dev
      # here makes direct builds from the development branch read correctly.
      text: dev
      menu:
        - text: dev
          href: https://pmsims-package.github.io/pmsims/dev/
        - text: 1.0.0 (stable)
          href: https://pmsims-package.github.io/pmsims/
        - text: 0.5.0
          href: https://pmsims-package.github.io/pmsims/0.5.0/
    get-started:
      text: Get started
      href: articles/pmsims.html
    articles:
      text: Articles
      menu:
        - text: Custom simulation workflows
          href: articles/simulate_custom.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      menu:
        - text: Releases
        - text: Version 1.0.0
          href: articles/release-1-0-0.html
        - text: Version 0.5.0
          href: articles/release-0-5-0.html
        - text: "--------"
        - text: Changelog
          href: news/index.html

home:
  title: "pmsims"
  description: >
    Simulation-based sample size estimation for prediction modelling, with
    regression-based and machine-learning models.
  sidebar:
    structure: [links, license, community, citation, dev, authors]

reference:
  - title: Main functions
    contents:
      - simulate_binary
      - simulate_continuous
      - simulate_survival
      - simulate_custom
