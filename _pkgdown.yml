url: https://pmsims-package.github.io/pmsims/

development:
  mode: auto
  version_tooltip: "Documentation for the development version of pmsims"

template:
  bootstrap: 5
  bootswatch: cosmo
  math-rendering: mathjax
  bslib:
    primary: "#04adbf"
    # primary: "#0054AD"
    danger: "#A6081A"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

output_dir: docs

extra_files:
  - man/figures

navbar:
  structure:
    left: [get-started, reference, articles, news]
    right: [versions, search, github, lightswitch]
  components:
    versions:
      text: 0.5.0
      menu:
        - text: 0.5.0 (stable)
          href: https://pmsims-package.github.io/pmsims/
        - text: dev
          href: https://pmsims-package.github.io/pmsims/dev/
    get-started:
      text: Get started
      href: articles/pmsims.html
    articles:
      text: Articles
      menu:
        - text: Custom simulation workflows
          href: articles/simulate_custom.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: News
      menu:
        - text: Releases
        - text: Version 0.5.0
          href: articles/release-0-5-0.html
        - text: "--------"
        - text: Changelog
          href: news/index.html

home:
  title: "pmsims"
  description: >
    Simulation-based sample size estimation for prediction modelling, with
    experimental machine-learning extensions.
  sidebar:
    structure: [links, license, community, citation, status, authors]
    components:
      status:
        title: Status
        text: |
          [![GitHub release](https://img.shields.io/github/v/release/pmsims-package/pmsims?display_name=release)](https://github.com/pmsims-package/pmsims/releases)
          [![R-CMD-check](https://github.com/pmsims-package/pmsims/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/pmsims-package/pmsims/actions/workflows/R-CMD-check.yaml)
          [![Codecov test coverage](https://codecov.io/gh/pmsims-package/pmsims/graph/badge.svg)](https://app.codecov.io/gh/pmsims-package/pmsims)

reference:
  - title: Main functions
    contents:
      - simulate_binary
      - simulate_continuous
      - simulate_survival
      - simulate_custom
